<title>BLS PM</title>
<style>

/* ============ 계산 (모든 표시값은 원본 데이터에서 직접 계산) ============ */
function gateStats() {
  const win = num(S('risk_window_days')) || 120;
  return DB.gates.map(g => {
    const cs = DB.checks.filter(c => c.gate === g.id);
    const done = cs.filter(c => yes(c.done)).length;
    const crit = cs.filter(c => yes(c.critical) && !yes(c.done));
    const over = cs.filter(c => !yes(c.done) && days(c.due) !== null && days(c.due) < 0);
    const dEnd = days(g.end);
    let st = 'ok';
    if (crit.length && dEnd !== null && dEnd < 0) st = 'fail';
    else if (crit.length && ((dEnd !== null && dEnd <= win) || over.some(c => yes(c.critical)))) st = 'risk';
    return { g, cs, done, total: cs.length, pct: cs.length ? Math.round(done / cs.length * 100) : 0, crit, over, dEnd, st, prop: /^S/i.test(g.id) };
  });
}
function verdict() {
  const st = gateStats().filter(s => s.total);
  const fail = st.filter(s => s.st === 'fail'), risk = st.filter(s => s.st === 'risk');
  return { v: fail.length ? 'NO-GO' : risk.length ? 'HOLD' : 'GO', list: fail.concat(risk), overCnt: st.reduce((a, s) => a + s.over.length, 0) };
}
function cnStat() {
  const tot = DB.bom.reduce((a, b) => a + num(b.cost_pct), 0) || 0;
  const now = DB.bom.filter(b => yes(b.cn_now)).reduce((a, b) => a + num(b.cost_pct), 0);
  const pot = DB.bom.filter(b => yes(b.cn_now) || yes(b.localizable)).reduce((a, b) => a + num(b.cost_pct), 0);
  const p = x => tot ? Math.round(x / tot * 1000) / 10 : 0;
  const th = String(S('cn_threshold')).trim();
  return { tot, now: p(now), pot: p(pot), th: th === '' ? null : num(th) };
}
function taskStat() {
  if (DB.tasks.length) { const n = DB.tasks.length; return { n, nodate: DB.tasks.filter(x => !pd(x.due)).length, mapped: DB.tasks.filter(x => String(x.gate).trim()).length, src: t('노션 동기화') }; }

/* ============ 저장 ============ */
function persist() {
  SYNC.at = new Date();
  ls(LS_DATA, JSON.stringify(DB));
  const c = jget(LS_CLOUD) || {};
  if (c.url) { setSave('sync', t('저장 대기')); clearTimeout(persist.tm); persist.tm = setTimeout(pushCloud, 1500); }
  else setSave('local');
}
function toSheet(tb) { const cols = SCHEMA[tb].cols; return { h: cols.map(c => c.l), rows: DB[tb].map(r => cols.map(c => r[c.k] === undefined ? '' : r[c.k])) }; }
function fromSheet(tb, objs) {
  const cols = SCHEMA[tb].cols;
  return (objs || []).map(o => { const r = {}; cols.forEach(c => { let v = o[c.l]; if (v === undefined) v = o[c.k]; r[c.k] = v === undefined || v === null ? '' : (typeof v === 'string' ? v.trim() : v); }); return r; })
    .filter(r => Object.values(r).some(v => String(v).trim() !== ''));
}
async function api(body) {
  const c = jget(LS_CLOUD) || {};

  const res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: c.token }, body)), redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error === 'auth' ? t('토큰 불일치') : j.error);
  return j;
}

function loadXLSX() {

  return new Promise((ok, no) => { const tr = i => { if (i >= urls.length) return no(new Error('XLSX CDN')); const s = document.createElement('script'); s.src = urls[i]; s.onload = () => window.XLSX ? ok() : tr(i + 1); s.onerror = () => tr(i + 1); document.head.appendChild(s); }; tr(0); });
}
async function importXlsx(file) {

    setSave('sync', t('엑셀 읽는 중')); await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });

    Object.keys(SCHEMA).forEach(k => { const ws = wb.Sheets[k]; if (ws) { hit++; d[k] = fromSheet(k, XLSX.utils.sheet_to_json(ws, { defval: '', raw: false, dateNF: 'yyyy-mm-dd' })); } });

    const d = new Date(); XLSX.writeFile(wb, `bls_pm_data_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`);
  } catch (e) { setSave('err', e.message); }

/* ============ 인라인 편집 (더블클릭 → 자동저장) ============ */
function rowOf(el) {
  const tb = el.dataset.t;
  if (el.dataset.k !== undefined) { let r = DB[tb].find(r => r.key === el.dataset.k); if (!r) { r = { key: el.dataset.k }; DB[tb].push(r); } return r; }
  return DB[tb][+el.dataset.i];
}
let EDITING = null;
function startEdit(el) {
  const tb = el.dataset.t, f = el.dataset.f, r = rowOf(el); if (!r) return;
  const c = col(tb, f), raw = r[f] === undefined ? '' : r[f]; EDITING = el;
  if (c && c.opt) {
    const sel = document.createElement('select'); sel.className = 'cell-sel';
    sel.innerHTML = [''].concat(c.opt).map(o => `<option ${String(o) === String(raw) ? 'selected' : ''} value="${esc(o)}">${esc(o === '' ? '—' : o)}</option>`).join('');
    el.innerHTML = ''; el.appendChild(sel); sel.focus();
    const fin = () => commit(el, sel.value); sel.onchange = fin; sel.onblur = fin; return;
  }
  const list = el.dataset.list === '1';
  el.textContent = list ? splitList(raw).join('\n') : String(raw);
  el.contentEditable = 'true'; el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el); const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  el.onblur = () => commit(el, el.innerText);
  el.onkeydown = k => {
    if (k.key === 'Enter' && !k.shiftKey && !list) { k.preventDefault(); el.blur(); }
    if (k.key === 'Escape') { el.onblur = null; EDITING = null; render(); }
  };
}
function commit(el, v) {
  if (el._done) return; el._done = 1; EDITING = null;
  const tb = el.dataset.t, f = el.dataset.f, r = rowOf(el);
  v = String(v).replace(/\u00a0/g, ' ').trim();
  if (el.dataset.list === '1') v = splitList(v).join('; ');
  if (r && String(r[f] === undefined ? '' : r[f]) !== v) { r[f] = v; persist(); }
  render();
}
/* 엑셀 붙여넣기(TSV): 편집 중인 셀부터 오른쪽·아래로 채움 */
document.addEventListener('paste', e => {
  const el = EDITING; if (!el || el.dataset.i === undefined) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!/\t|\n./.test(txt)) return;
  e.preventDefault();
  const tb = el.dataset.t, cols = SCHEMA[tb].cols.map(c => c.k), c0 = cols.indexOf(el.dataset.f), r0 = +el.dataset.i;
  txt.replace(/\r/g, '').split('\n').filter((l, i, a) => l !== '' || i < a.length - 1).forEach((line, ri) => {
    const row = DB[tb][r0 + ri] || (DB[tb][r0 + ri] = {});
    line.split('\t').forEach((v, ci) => { const k = cols[c0 + ci]; if (k) row[k] = v.trim(); });
  });
  el._done = 1; EDITING = null; persist(); render();
});

/* ============ 이벤트 ============ */
document.addEventListener('dblclick', e => { const el = e.target.closest('.ed'); if (!el || el.isContentEditable || el.querySelector('select')) return; e.preventDefault(); startEdit(el); });
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q('[data-page]'))) { UI.page = el.dataset.page; document.getElementById('side').classList.remove('open'); render(); window.scrollTo(0, 0); return; }
  if ((el = q('[data-tab]'))) { UI.tab = UI.tab || {}; UI.tab[el.dataset.tab] = el.dataset.v; render(); return; }
  if ((el = q('[data-sg]'))) { UI.sg = UI.sg || {}; UI.sg[el.dataset.sg] = !UI.sg[el.dataset.sg]; render(); return; }
  if ((el = q('[data-tog]'))) { const r = DB[el.dataset.tog][+el.dataset.i]; r[el.dataset.f] = yes(r[el.dataset.f]) ? 'N' : 'Y'; persist(); render(); return; }
  if ((el = q('[data-del]'))) { const tb = el.dataset.del, i = +el.dataset.i; const r = DB[tb][i]; const lab = Object.values(r).find(v => String(v).trim()) || ''; if (confirm(t('이 행을 삭제할까요?') + '\n' + lab)) { DB[tb].splice(i, 1); persist(); render(); } return; }
  if ((el = q('[data-add]'))) { let def = {}; try { def = JSON.parse(el.dataset.def || '{}'); } catch (x) {} DB[el.dataset.add].push(def); persist(); render(); return; }
  if ((el = q('[data-fold]'))) { const id = el.dataset.fold; UI.closed[id] = !UI.closed[id]; render(); return; }
  if ((el = q('[data-seg]'))) { UI[el.dataset.seg] = el.dataset.v; render(); return; }
  if ((el = q('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'sideHide') { UI.sideHide = true; render(); }
    if (a === 'sgAll') { UI.sg = {}; if (el.dataset.v === '0') MENU.forEach(g => UI.sg[g[1]] = true); render(); }
    if (a === 'import') document.getElementById('fileIn').click();
    if (a === 'export') exportXlsx();
    if (a === 'reset' && confirm(t('이 브라우저의 로컬 데이터를 지웁니다. 시트 데이터는 그대로입니다.'))) { DB = emptyDB(); ls(LS_DATA, JSON.stringify(DB)); render(); }
    if (a === 'cSave') { const url = document.getElementById('cUrl').value.trim(), token = document.getElementById('cTok').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) { setSave('err', t('Apps Script URL 형식이 아닙니다') + ' (https://script.google.com/…/exec)'); return; } ls(LS_CLOUD, JSON.stringify({ url, token })); pullCloud(); }
    if (a === 'push') pushCloud();
    if (a === 'cClear') { ls(LS_CLOUD, '{}'); SYNC.st = 'local'; render(); }
  }
});
document.getElementById('fileIn').onchange = e => { const f = e.target.files[0]; if (f) importXlsx(f); e.target.value = ''; };
document.getElementById('syncBtn').onclick = () => { const c = jget(LS_CLOUD) || {}; if (c.url) pullCloud(); else document.getElementById('fileIn').click(); };
document.getElementById('menuBtn').onclick = () => { if (window.innerWidth <= 768) document.getElementById('side').classList.toggle('open'); else { UI.sideHide = !UI.sideHide; render(); } };
document.getElementById('lk').onclick = () => { UI.lang = 'ko'; render(); };
document.getElementById('lz').onclick = () => { UI.lang = 'zh'; render(); };

/* ============ 시작: 로컬 → (연결 시) 시트가 원본으로 덮어씀 ============ */
(function init() {
  const local = jget(LS_DATA);
  if (local) { const d = emptyDB(); Object.keys(SCHEMA).forEach(k => { if (Array.isArray(local[k])) d[k] = local[k]; }); DB = d; }
  render();
  if ((jget(LS_CLOUD) || {}).url) pullCloud();
})();
</script>
</body>
