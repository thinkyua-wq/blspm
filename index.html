<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>BLS PM</title>
<style>
@font-face{font-family:'CJKChineseFont';src:local('Microsoft YaHei'),local('微软雅黑'),local('PingFang SC'),local('Source Han Sans CN'),local('SimHei');unicode-range:U+4E00-9FFF,U+3400-4DBF,U+F900-FAFF;font-display:swap}
:root{--ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e8edf4;--line2:#cbd5e1;--bg:#f5f7fb;--accent:#1e2f5e;--accent-2:#2a51ab;--accent-soft:#e9edf6;--ok:#059669;--warn:#d97706;--bad:#dc2626;
--body-fs:12px;--body-font:"CJKChineseFont","Malgun Gothic","맑은 고딕","Microsoft YaHei","微软雅黑",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--body-font);background:var(--bg);color:var(--ink);display:flex;font-size:12px}
html.lang-zh body{font-family:"CJKChineseFont","Microsoft YaHei","微软雅黑","PingFang SC",sans-serif}
button,input,select{font-family:inherit}button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#c7d2de}
aside{width:214px;flex-shrink:0;background:#0d1a42;color:#fff;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.side-hd{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.10)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3d6cca,#5b8ce0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.side-t1{font-size:15px;font-weight:800;letter-spacing:-.3px}.side-t3{font-size:9.5px;font-weight:700;letter-spacing:1px;color:#9bb4e0}
.side-g{display:flex;align-items:center;gap:8px;padding:10px 10px 4px 12px;font-size:12px;font-weight:700;color:#c9d8f2}
.side-g i{width:6px;height:6px;background:#8fa9d6;display:inline-block}
.side-m{position:relative;display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px 7px 26px;font-size:12.4px;color:#a9c0e6;background:none;border:none;text-align:left;border-radius:6px}
.side-m:hover{background:rgba(255,255,255,.07);color:#fff}
.side-m.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.side-m.on::after{content:'';position:absolute;right:0;top:4px;bottom:4px;width:3px;background:#9bc0f4;border-radius:3px 0 0 3px}
.side-m .n{margin-left:auto;background:#e11d48;color:#fff;font-size:10px;padding:0 5px;font-weight:700}
.side-info{margin:auto 10px 12px;padding:9px 10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#9bb4e0;font-size:10.5px;line-height:1.7}
.side-info b{color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:20}
.crumb{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--ink)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.save{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}.save i{width:7px;height:7px;border-radius:50%;background:#94a3b8;display:inline-block}
.save.cloud i{background:var(--ok)}.save.local i{background:#3d6cca}.save.sync i{background:var(--warn)}.save.err i{background:var(--bad)}.save.err{color:var(--bad)}
.ui-seg{display:inline-flex;border:1px solid var(--line2);background:#fff}
.ui-seg button{padding:4px 12px;font-size:11px;font-weight:600;color:#64748b;background:#fff;border:none;border-right:1px solid var(--line2);white-space:nowrap}
.ui-seg button:last-child{border-right:none}.ui-seg button.on{background:var(--accent);color:#fff}
.ui-btn{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11px;border:1px solid var(--line2);background:#fff;color:var(--ink2);padding:5px 10px;white-space:nowrap}
.ui-btn:hover{background:#f8fafc;border-color:#94a3b8}.ui-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.ui-btn.pri:hover{background:#16244a}
.ui-btn.sm{padding:2px 8px;font-size:10.5px}.ui-btn.dgr{color:var(--bad);border-color:#fecaca}
.menu-btn{display:none;border:1px solid var(--line2);background:#fff;padding:4px 8px}
#view{padding:16px 20px 48px}
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ui-page-t{font-size:19px;font-weight:800;color:#1e2f5e;letter-spacing:-.4px;margin:0}
.pg-d{font-size:11.5px;color:#141826;margin-top:2px}
.ui-sec{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.ui-sec .num{width:18px;height:18px;border-radius:5px;background:#1e293b;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ui-sec-t{font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap}.ui-sec-l{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.ui-card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04);overflow:hidden}
.ui-card-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fdfdff,#fafbfe)}
.ui-card-t{font-size:12.5px;font-weight:700;color:#1e2f5e;letter-spacing:-.2px;flex:1;min-width:0}
.ui-card-b{padding:14px}.ui-card-b.np{padding:0}
.fold{border:none;background:none;color:#cbd5e1;font-size:12px;padding:0 2px}.fold:hover{color:#475569}
.ui-card.closed .ui-card-b{display:none}.ui-card.closed .ui-card-h{border-bottom:none}
.ui-kpi{background:#fff;border:1px solid var(--line);padding:9px 12px 10px;box-shadow:0 1px 2px rgba(15,23,42,.04);min-width:0}
.ui-kpi-l{font-size:11.5px;color:var(--muted);font-weight:600}
.ui-kpi-v{font-size:21px;font-weight:800;color:#1e2f5e;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-kpi-u{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:3px}
.ui-kpi-s{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-kpi.alert{box-shadow:inset 3px 0 0 #dc2626}.ui-kpi.alert .ui-kpi-v{color:#dc2626}.ui-kpi.warnk{box-shadow:inset 3px 0 0 #d97706}.ui-kpi.okk{box-shadow:inset 3px 0 0 #059669}
.tblwrap{overflow-x:auto}
.ui-tbl{width:100%;border-collapse:collapse;background:#fff;font-size:var(--body-fs);color:#111827}
.ui-tbl thead th{background:#f1f3f7;color:#1f2937;font-weight:700;text-align:center;border:1px solid #dde2ea;padding:7px 8px;white-space:nowrap}
.ui-tbl tbody td{border:1px solid #e6e9ef;padding:6px 8px;vertical-align:middle;font-variant-numeric:tabular-nums;line-height:1.45}
.ui-tbl tbody tr:hover td{background:#f8fafc}
.ui-tbl td.ctr{text-align:center}.ui-tbl td.num{text-align:right}.ui-tbl td.lbl{font-weight:700}.ui-tbl td.nw{white-space:nowrap}
.ui-tbl tfoot td{border:1px solid #e6e9ef;border-top:2px solid #9aa6b8;padding:7px 8px;font-weight:700}
.ui-tbl td.x{width:28px;padding:0;text-align:center}
.del{border:none;background:none;color:#cbd5e1;font-size:14px;line-height:1;padding:4px}.del:hover{color:var(--bad)}
.ed{cursor:text}.ed:hover{background:#e9edf6 !important;outline:1px dashed #c7d2fe;outline-offset:-1px}
.ed[contenteditable=true]{background:#fff !important;outline:2px solid #2a51ab;outline-offset:-2px;white-space:pre-wrap}
.cell-sel{width:100%;font-size:12px;border:1px solid #2a51ab;padding:2px}
.b{display:inline-flex;align-items:center;padding:1px 6px;font-size:10.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.b-ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.b-warn{background:#fffbeb;color:#b45309;border-color:#fde68a}
.b-risk{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.b-bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.b-info{background:#eef4ff;color:#152a63;border-color:#ddd6fe}.b-gray{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.bar{background:#eef2f7;height:6px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%}
.verdict{display:flex;align-items:stretch;border:1px solid var(--line);background:#fff;margin-bottom:12px}
.verdict .vl{color:#fff;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;min-width:124px}
.verdict .vl b{font-size:21px;letter-spacing:-.5px}.verdict .vl span{font-size:10.5px;opacity:.9}
.verdict .vr{padding:9px 14px;font-size:12px;line-height:1.7;flex:1;min-width:0}
.verdict ul{margin:0 0 4px;padding-left:16px}
.g-row,.g-axis{display:grid;grid-template-columns:180px 1fr 56px;align-items:center}
.g-row{border-bottom:1px solid #eef1f6;min-height:36px}
.g-lbl{font-size:12px;font-weight:700;color:#1e2f5e;padding-right:8px}.g-lbl small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.g-track{position:relative;height:36px}
.g-bar{position:absolute;top:10px;height:16px;background:#c9d2e4}.g-bar>i{display:block;height:100%;background:#1e2f5e}
.g-bar.risk{background:#fbd5d5}.g-bar.risk>i{background:#dc2626}.g-bar.fail{background:#dc2626}
.g-bar.prop{background:repeating-linear-gradient(45deg,#fde68a,#fde68a 4px,#fff7d6 4px,#fff7d6 8px);outline:1px dashed #d97706}
.g-pct{font-size:11.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.g-axis{font-size:10.5px;color:var(--faint)}.g-ticks{position:relative;height:18px}.g-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.g-ovl{position:absolute;left:180px;right:56px;top:18px;bottom:0;pointer-events:none}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid #e11d48;z-index:3}.g-today span{position:absolute;bottom:-15px;left:3px;font-size:10px;font-weight:700;color:#e11d48;white-space:nowrap}
.g-launch{position:absolute;top:0;bottom:0;border-left:2px dashed #1e2f5e;z-index:3}.g-launch span{position:absolute;bottom:-15px;right:3px;font-size:10px;font-weight:700;color:#1e2f5e;white-space:nowrap}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eef1f6;font-size:12px}
.chk:last-child{border-bottom:none}.chk .txt{flex:1;min-width:0}
.bx{width:14px;height:14px;border:1.5px solid #94a3b8;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;background:#fff}
.bx.on{background:#1e2f5e;border-color:#1e2f5e;color:#fff}
.crit{margin-left:5px;font-size:9.5px;font-weight:700;color:#b91c1c;border:1px solid #fecaca;background:#fef2f2;padding:0 4px;cursor:pointer}
.crit.off{color:#94a3b8;border-color:#e2e8f0;background:#fff}
.due{font-size:10.5px;color:var(--muted);white-space:nowrap}.due.over{color:#dc2626;font-weight:700}
.steps{display:flex}
.step{flex:1;position:relative;padding:12px 6px 8px;text-align:center;border-top:4px solid #e2e8f0;min-width:0}
.step.s-완료{border-top-color:#1e2f5e}.step.s-정체{border-top-color:#dc2626}.step.s-진행{border-top-color:#d97706}
.step b{display:block;font-size:12px}.step .sd{font-size:10.5px;color:var(--muted);display:block;margin:2px 0 4px}
.step .dot{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#e2e8f0;border:2px solid #fff}
.step.s-완료 .dot{background:#1e2f5e}.step.s-정체 .dot{background:#dc2626}.step.s-진행 .dot{background:#d97706}
.note{font-size:12px;color:#111827;line-height:1.7;background:#f8fafc;border:1px solid var(--line);padding:9px 12px}
.note b{color:#1e2f5e}.note .h{font-weight:800;color:#1e2f5e;margin-right:6px}
.gauge{height:22px;background:#eef2f7;position:relative}
.gauge .fp{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#dbe4f4,#dbe4f4 4px,#eef2f7 4px,#eef2f7 8px)}
.gauge .fc{position:absolute;left:0;top:0;bottom:0;background:#1e2f5e}
.gauge .tg{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed #dc2626}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:44px repeat(3,1fr);grid-template-rows:repeat(3,58px) 22px;gap:3px}
.heat .c{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:3px}
.heat .ax{font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.rk{font-size:10.5px;font-weight:800;background:#fff;border:1px solid #cbd5e1;padding:1px 5px;color:#1e2f5e}
.lane{border:1px solid var(--line);padding:10px 12px;background:#fff}
.lane h4{margin:0 0 6px;font-size:12.5px;color:#1e2f5e}.lane .li{font-size:12px;line-height:1.8}
.lane.draft{border:1px dashed #d97706;background:#fffdf5}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
.frm{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;font-size:12px}
.frm input{border:1px solid var(--line2);padding:6px 8px;font-size:12px;width:100%}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
.tag-s{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g-73{grid-template-columns:1fr}}
@media (max-width:768px){aside{position:fixed;left:-220px;z-index:40;transition:left .25s}aside.open{left:0}.menu-btn{display:inline-block}.g2,.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g-row,.g-axis{grid-template-columns:110px 1fr 40px}.g-ovl{left:110px;right:40px}#view{padding:12px}.topbar .crumb{display:none}.steps{flex-wrap:wrap}.step{flex:0 0 33.3%}.verdict{flex-direction:column}.verdict .vl{flex-direction:row;align-items:baseline;gap:8px;padding:8px 14px}.tblwrap .ui-tbl{min-width:680px}.g-ticks span{font-size:9.5px}}
@media print{aside,.topbar,.del,.ui-btn,.fold{display:none !important}body{background:#fff}.ui-card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<aside id="side"></aside>
<main>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="crumb" id="crumb"></div>
    <div class="tb-r">
      <div class="save" id="save"><i></i><span id="saveTxt">로컬</span></div>
      <div class="ui-seg"><button id="lk" class="on">한국어</button><button id="lz">中文</button></div>
      <button class="ui-btn pri" id="syncBtn"></button>
    </div>
  </div>
  <div id="view"></div>
</main>
<input type="file" id="fileIn" accept=".xlsx,.xls" style="display:none" />
<script>

function gantt(gs) {

  h += card('risk', t('리스크'), `<div class="tblwrap"><table class="ui-tbl">${TH(['No', ['리스크', 'text-align:left'], '영향(1-3)', '가능성(1-3)', '등급', ['대응', 'text-align:left'], '담당'])}<tbody>${DB.risks.map((r, i) => { const L = riskLv(r); return `<tr><td class="ctr">R${i + 1}</td>${TD('risks', i, 'title', 'lbl')}${TD('risks', i, 'impact', 'ctr')}${TD('risks', i, 'likelihood', 'ctr')}<td class="ctr"><span class="b ${L[1]}">${L[0]}</span></td>${TD('risks', i, 'action')}${TD('risks', i, 'owner', 'ctr nw')}${DEL('risks', i)}</tr>`; }).join('')}</tbody></table></div>`, ADD('risks', { impact: '2', likelihood: '2' }), true);
  return h;
}

/* ============ P7 데이터 연동 ============ */
function pageData() {
  const c = jget(LS_CLOUD) || {};
  let h = head('데이터 연동', '노션 = 실행 로그, 구글시트 = 원본 데이터, 웹앱 = 판정 화면');
  h += `<div class="grid g2">${card('cloud', t('구글시트 연결'), `<div class="frm"><label>Apps Script URL</label><input id="cUrl" name="bls-gas-url" autocomplete="off" spellcheck="false" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" /><label>${t('토큰')}</label><input id="cTok" name="bls-gas-token" type="text" autocomplete="off" spellcheck="false" value="${esc(c.token || '')}" placeholder="Code.gs의 TOKEN" /></div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="ui-btn pri" data-act="cSave">${t('연결 저장 후 불러오기')}</button><button class="ui-btn" data-act="push">${t('지금 시트에 저장')}</button><button class="ui-btn dgr" data-act="cClear">${t('연결 해제')}</button></div>
    <div class="hint" style="margin-top:10px">${t('URL과 토큰은 이 브라우저에만 저장되고 HTML 파일에는 들어가지 않습니다. 편집 1.5초 후 자동으로 시트에 저장되며, 주차별 스냅샷이 _history 탭에 쌓입니다.')}</div>
    <div class="hint" style="margin-top:4px">${t('상태')}: <b>${esc(SYNC.msg || ({ local: t('로컬'), cloud: t('시트 연결됨'), sync: t('동기화 중'), err: t('오류') }[SYNC.st] || SYNC.st))}</b></div>`)}
   ${card('file', t('엑셀 파일'), `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ui-btn pri" data-act="import">${t('엑셀 가져오기')}</button><button class="ui-btn" data-act="export">${t('엑셀 내보내기')}</button><button class="ui-btn dgr" data-act="reset">${t('로컬 데이터 초기화')}</button></div>
    <div class="hint" style="margin-top:10px">${t('bls_pm_data.xlsx 형식을 그대로 읽습니다. 가져오면 현재 화면 데이터를 덮어씁니다. 클라우드가 연결돼 있으면 가져온 내용이 시트에도 저장됩니다.')}</div>`)}</div>`;
  h += sec(1, '설정값', `<span class="hint">${t('더블클릭 수정')}</span>`);
  h += card('set', t('settings'), `<table class="ui-tbl">${TH([['항목키', 'width:160px'], ['값', 'width:200px'], '설명'])}<tbody>${DB.settings.map((r, i) => `<tr>${TD('settings', i, 'key', 'lbl nw')}${TD('settings', i, 'value', 'ctr', esc(r.value) || `<span style="color:#b91c1c">${t('공란')}</span>`)}${TD('settings', i, 'note')}${DEL('settings', i)}</tr>`).join('')}</tbody></table>`, ADD('settings', {}), true);
  h += sec(2, '시트 탭 구조');
  h += card('tabs', t('탭'), `<table class="ui-tbl">${TH(['탭', '이름', '용도', '연결 화면', '행수', ['열', 'text-align:left']])}<tbody>${Object.keys(SCHEMA).map(k => `<tr><td class="lbl">${k}</td><td class="ctr">${esc(SCHEMA[k].name)}</td><td>${esc(SCHEMA[k].use)}</td><td class="ctr">${t(SCHEMA[k].page)}</td><td class="num">${DB[k].length}</td><td>${SCHEMA[k].cols.map(c => esc(c.l)).join(' · ')}</td><td class="x"></td></tr>`).join('')}</tbody></table>`, '', true);
  return h;
}

function pageEmpty() {
  return head('BLS PM', 'BIOLASE 중국 OEM 프로젝트 판정 화면') + card('empty', t('데이터 없음'), `<div class="empty">${t('아직 데이터가 없습니다.')}<br>${t('bls_pm_data.xlsx를 가져오거나, 구글시트를 연결하세요.')}<div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><button class="ui-btn pri" data-act="import">${t('엑셀 가져오기')}</button><button class="ui-btn" data-page="p7">${t('구글시트 연결')}</button></div></div>`);
}

/* ============ 렌더 ============ */
const PAGES = { p1: pageGate, p2: pageStruct, p3: pageReg, p4: pageLine, p5: pageSales, p6: pageBiz, p7: pageData };
function render() {
  document.documentElement.classList.toggle('lang-zh', UI.lang === 'zh');
  document.getElementById('lk').classList.toggle('on', UI.lang !== 'zh'); document.getElementById('lz').classList.toggle('on', UI.lang === 'zh');
  renderSide();
  const m = MENU.flatMap(g => g[1]).find(x => x[0] === UI.page) || MENU[0][1][0];
  document.getElementById('crumb').innerHTML = `${esc(S('project_name') || 'BIOLASE')} / <b>${t(m[1])}</b>`;
  const sy = window.scrollY;
  document.getElementById('view').innerHTML = (!DB.gates.length && UI.page !== 'p7') ? pageEmpty() : PAGES[UI.page]();
  window.scrollTo(0, sy);
  setSave(SYNC.st, SYNC.msg);
  ls(LS_UI, JSON.stringify(UI));
}
function setSave(st, msg) {
  SYNC.st = st; SYNC.msg = msg || '';
  const el = document.getElementById('save'); el.className = 'save ' + st;
  const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  document.getElementById('saveTxt').textContent = { local: t('로컬 저장') + (SYNC.at ? ' ' + hm(SYNC.at) : ''), cloud: t('시트 저장됨') + (SYNC.at ? ' ' + hm(SYNC.at) : ''), sync: msg || t('동기화 중'), err: t('오류') + ': ' + (msg || '') }[st] || st;
  const c = jget(LS_CLOUD) || {};
  document.getElementById('syncBtn').textContent = c.url ? t('시트 불러오기') : t('엑셀 가져오기');
}

/* ============ 저장 ============ */
function persist() {
  SYNC.at = new Date();
  ls(LS_DATA, JSON.stringify(DB));
  const c = jget(LS_CLOUD) || {};
  if (c.url) { setSave('sync', t('저장 대기')); clearTimeout(persist.tm); persist.tm = setTimeout(pushCloud, 1500); }
  else setSave('local');
}
function toSheet(tb) { const cols = SCHEMA[tb].cols; return { h: cols.map(c => c.l), rows: DB[tb].map(r => cols.map(c => r[c.k] === undefined ? '' : r[c.k])) }; }
function fromSheet(tb, objs) {
  const cols = SCHEMA[tb].cols;
  return (objs || []).map(o => { const r = {}; cols.forEach(c => { let v = o[c.l]; if (v === undefined) v = o[c.k]; r[c.k] = v === undefined || v === null ? '' : (typeof v === 'string' ? v.trim() : v); }); return r; })
    .filter(r => Object.values(r).some(v => String(v).trim() !== ''));
}
async function api(body) {
  const c = jget(LS_CLOUD) || {};
  if (!c.url) throw new Error(t('연결 안 됨'));
  const res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: c.token }, body)), redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error === 'auth' ? t('토큰 불일치') : j.error);
  return j;
}
async function pullCloud() {
  setSave('sync', t('시트 불러오는 중'));
  try { const j = await api({ action: 'load' }); const d = emptyDB(); let n = 0; Object.keys(SCHEMA).forEach(k => { d[k] = fromSheet(k, (j.tabs || {})[k]); n += d[k].length; });
    const localN = Object.keys(SCHEMA).reduce((a, k) => a + DB[k].length, 0);
    if (!n && localN) { if (confirm(t('시트가 비어 있습니다. 현재 화면 데이터를 시트에 올릴까요?'))) { await pushCloud(); } else setSave('local'); return; }
    DB = d; SYNC.at = new Date(); ls(LS_DATA, JSON.stringify(DB)); SYNC.st = 'cloud'; SYNC.msg = ''; render(); }
  catch (e) { setSave('err', e.message); }
}
async function pushCloud() {
  const tabs = {}; Object.keys(SCHEMA).forEach(k => tabs[k] = toSheet(k));
  try { setSave('sync', t('시트 저장 중')); await api({ action: 'save', tabs }); SYNC.at = new Date(); setSave('cloud'); }
  catch (e) { setSave('err', e.message); }
}

/* ============ 엑셀 ============ */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  const urls = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js', 'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  return new Promise((ok, no) => { const tr = i => { if (i >= urls.length) return no(new Error('XLSX CDN')); const s = document.createElement('script'); s.src = urls[i]; s.onload = () => window.XLSX ? ok() : tr(i + 1); s.onerror = () => tr(i + 1); document.head.appendChild(s); }; tr(0); });
}
async function importXlsx(file) {
  try {
    setSave('sync', t('엑셀 읽는 중')); await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    const d = emptyDB(); let hit = 0;
    Object.keys(SCHEMA).forEach(k => { const ws = wb.Sheets[k]; if (ws) { hit++; d[k] = fromSheet(k, XLSX.utils.sheet_to_json(ws, { defval: '', raw: false, dateNF: 'yyyy-mm-dd' })); } });
    if (!hit) throw new Error(t('BLS PM 형식의 탭이 없습니다'));
    DB = d; persist(); render();
  } catch (e) { setSave('err', e.message); }
}
async function exportXlsx() {
  try {
    await loadXLSX(); const wb = XLSX.utils.book_new();
    Object.keys(SCHEMA).forEach(k => { const s = toSheet(k); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([s.h].concat(s.rows)), k); });
    const d = new Date(); XLSX.writeFile(wb, `bls_pm_data_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.xlsx`);
  } catch (e) { setSave('err', e.message); }
}

/* ============ 인라인 편집 (더블클릭 → 자동저장) ============ */
function rowOf(el) {
  const tb = el.dataset.t;
  if (el.dataset.k !== undefined) { let r = DB[tb].find(r => r.key === el.dataset.k); if (!r) { r = { key: el.dataset.k }; DB[tb].push(r); } return r; }
  return DB[tb][+el.dataset.i];
}
let EDITING = null;
function startEdit(el) {
  const tb = el.dataset.t, f = el.dataset.f, r = rowOf(el); if (!r) return;
  const c = col(tb, f), raw = r[f] === undefined ? '' : r[f]; EDITING = el;
  if (c && c.opt) {
    const sel = document.createElement('select'); sel.className = 'cell-sel';
    sel.innerHTML = [''].concat(c.opt).map(o => `<option ${String(o) === String(raw) ? 'selected' : ''} value="${esc(o)}">${esc(o === '' ? '—' : o)}</option>`).join('');
    el.innerHTML = ''; el.appendChild(sel); sel.focus();
    const fin = () => commit(el, sel.value); sel.onchange = fin; sel.onblur = fin; return;
  }
  const list = el.dataset.list === '1';
  el.textContent = list ? splitList(raw).join('\n') : String(raw);
  el.contentEditable = 'true'; el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el); const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  el.onblur = () => commit(el, el.innerText);
  el.onkeydown = k => {
    if (k.key === 'Enter' && !k.shiftKey && !list) { k.preventDefault(); el.blur(); }
    if (k.key === 'Escape') { el.onblur = null; EDITING = null; render(); }
  };
}
function commit(el, v) {
  if (el._done) return; el._done = 1; EDITING = null;
  const tb = el.dataset.t, f = el.dataset.f, r = rowOf(el);
  v = String(v).replace(/\u00a0/g, ' ').trim();
  if (el.dataset.list === '1') v = splitList(v).join('; ');
  if (r && String(r[f] === undefined ? '' : r[f]) !== v) { r[f] = v; persist(); }
  render();
}
/* 엑셀 붙여넣기(TSV): 편집 중인 셀부터 오른쪽·아래로 채움 */
document.addEventListener('paste', e => {
  const el = EDITING; if (!el || el.dataset.i === undefined) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!/\t|\n./.test(txt)) return;
  e.preventDefault();
  const tb = el.dataset.t, cols = SCHEMA[tb].cols.map(c => c.k), c0 = cols.indexOf(el.dataset.f), r0 = +el.dataset.i;
  txt.replace(/\r/g, '').split('\n').filter((l, i, a) => l !== '' || i < a.length - 1).forEach((line, ri) => {
    const row = DB[tb][r0 + ri] || (DB[tb][r0 + ri] = {});
    line.split('\t').forEach((v, ci) => { const k = cols[c0 + ci]; if (k) row[k] = v.trim(); });
  });
  el._done = 1; EDITING = null; persist(); render();
});

/* ============ 이벤트 ============ */
document.addEventListener('dblclick', e => { const el = e.target.closest('.ed'); if (!el || el.isContentEditable || el.querySelector('select')) return; e.preventDefault(); startEdit(el); });
document.addEventListener('click', e => {
  const q = s => e.target.closest(s);
  let el;
  if ((el = q('[data-page]'))) { UI.page = el.dataset.page; document.getElementById('side').classList.remove('open'); render(); window.scrollTo(0, 0); return; }
  if ((el = q('[data-tog]'))) { const r = DB[el.dataset.tog][+el.dataset.i]; r[el.dataset.f] = yes(r[el.dataset.f]) ? 'N' : 'Y'; persist(); render(); return; }
  if ((el = q('[data-del]'))) { const tb = el.dataset.del, i = +el.dataset.i; const r = DB[tb][i]; const lab = Object.values(r).find(v => String(v).trim()) || ''; if (confirm(t('이 행을 삭제할까요?') + '\n' + lab)) { DB[tb].splice(i, 1); persist(); render(); } return; }
  if ((el = q('[data-add]'))) { let def = {}; try { def = JSON.parse(el.dataset.def || '{}'); } catch (x) {} DB[el.dataset.add].push(def); persist(); render(); return; }
  if ((el = q('[data-fold]'))) { const id = el.dataset.fold; UI.closed[id] = !UI.closed[id]; render(); return; }
  if ((el = q('[data-seg]'))) { UI[el.dataset.seg] = el.dataset.v; render(); return; }
  if ((el = q('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'import') document.getElementById('fileIn').click();
    if (a === 'export') exportXlsx();
    if (a === 'reset' && confirm(t('이 브라우저의 로컬 데이터를 지웁니다. 시트 데이터는 그대로입니다.'))) { DB = emptyDB(); ls(LS_DATA, JSON.stringify(DB)); render(); }
    if (a === 'cSave') { const url = document.getElementById('cUrl').value.trim(), token = document.getElementById('cTok').value.trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) { setSave('err', t('Apps Script URL 형식이 아닙니다') + ' (https://script.google.com/…/exec)'); return; } ls(LS_CLOUD, JSON.stringify({ url, token })); pullCloud(); }
    if (a === 'push') pushCloud();
    if (a === 'cClear') { ls(LS_CLOUD, '{}'); SYNC.st = 'local'; render(); }
  }
});
document.getElementById('fileIn').onchange = e => { const f = e.target.files[0]; if (f) importXlsx(f); e.target.value = ''; };
document.getElementById('syncBtn').onclick = () => { const c = jget(LS_CLOUD) || {}; if (c.url) pullCloud(); else document.getElementById('fileIn').click(); };
document.getElementById('menuBtn').onclick = () => document.getElementById('side').classList.toggle('open');
document.getElementById('lk').onclick = () => { UI.lang = 'ko'; render(); };
document.getElementById('lz').onclick = () => { UI.lang = 'zh'; render(); };

/* ============ 시작: 로컬 → (연결 시) 시트가 원본으로 덮어씀 ============ */
(function init() {
  const local = jget(LS_DATA);
  if (local) { const d = emptyDB(); Object.keys(SCHEMA).forEach(k => { if (Array.isArray(local[k])) d[k] = local[k]; }); DB = d; }
  render();
  if ((jget(LS_CLOUD) || {}).url) pullCloud();
})();
</script>
